services:
  - type: web
    name: clovermood-backend
    runtime: docker
    plan: standard
    region: oregon
    healthCheckPath: /api/actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -Xms256m -Xmx512m
      - key: SUPABASE_URL
        sync: true
      - key: SUPABASE_KEY
        sync: true
      - key: SUPABASE_JWT_SECRET
        sync: true
      - key: CORS_ALLOWED_ORIGINS
        sync: true
