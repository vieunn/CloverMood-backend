server.servlet.context-path=/api
server.port=${PORT:8080}

logging.level.root=WARN
logging.level.com.example.api=INFO

spring.profiles.active=prod

# Read environment variables directly - Spring Boot will look for these env vars
supabase.url=${SUPABASE_URL:https://default.supabase.co}
supabase.key=${SUPABASE_KEY:default_key}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:default_secret}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://clovermood-x34a.onrender.com,http://localhost:3000}

# Security settings for production
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# Actuator endpoints
management.endpoints.web.exposure.include=health
